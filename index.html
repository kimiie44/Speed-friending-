<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Friending</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff8ef,#f3f0ff);color:#252238;display:flex;justify-content:center}
.app{width:min(680px,100%);padding:28px 18px 44px} header{text-align:center;margin:12px 0 26px}.emoji{font-size:44px}h1{font-size:clamp(34px,8vw,52px);margin:4px 0 6px;letter-spacing:-1.5px}.subtitle{margin:0 auto;max-width:500px;color:#69657a;font-size:16px;line-height:1.5}
.card{background:rgba(255,255,255,.9);border:1px solid rgba(40,35,70,.09);border-radius:24px;padding:22px;box-shadow:0 12px 35px rgba(55,45,95,.09);margin-bottom:16px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:17px;padding:17px 14px;font:inherit;font-weight:750;cursor:pointer;background:#f0edf8;color:#302b48;transition:transform .12s,box-shadow .12s}button:active{transform:scale(.98)}button:hover{box-shadow:0 7px 18px rgba(40,35,70,.12)}.cat span{display:block;font-size:26px;margin-bottom:5px}.cat small{display:block;font-weight:500;color:#777286;margin-top:3px}
.question{text-align:center;padding:30px 20px}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#f0edf8;color:#615b78;font-size:13px;font-weight:750}#questionText{font-size:clamp(24px,6vw,36px);line-height:1.22;margin:22px 0 26px;letter-spacing:-.5px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.primary{background:#29233f;color:white;min-width:190px}.secondary{background:#eeeaf6}.back{margin-top:10px;width:100%;background:transparent;color:#706b7e;padding:10px}.tip{font-size:14px;line-height:1.5;color:#6f6a7b;text-align:center;margin:14px 4px 0}footer{text-align:center;color:#8a8594;font-size:12px;margin-top:22px}@media(max-width:430px){.categories{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>
<body>
<main class="app">
<header><div class="emoji">🤝</div><h1>Speed Friending</h1><p class="subtitle">Pick a vibe, get a random question, and see where the conversation goes. There are no wrong answers.</p></header>
<section id="home" class="card"><div id="categories" class="categories"></div><p class="tip">💡 Don't like a question? Just tap “Another one”.</p></section>
<section id="questionCard" class="card question" hidden><div id="categoryPill" class="pill"></div><div id="questionText"></div><div class="actions"><button class="primary" onclick="nextQuestion()">🔄 Another one</button><button class="secondary" onclick="shuffleCategory()">🎲 New category</button></div><button class="back" onclick="goHome()">← Back to categories</button></section>
<footer>Made for a social, not an interview. Ask follow-ups. Be curious. Have fun.</footer>
</main>

<script>
// ============================================================
// ✏️ EDIT THIS SECTION ONLY!
// Change category names, descriptions and questions.
// Everything else can stay exactly as it is.
// ============================================================

const questionSets = [
  {
    name: "🌱 Easy & Fun",
    description: "Break the ice",
    questions: [
      "What's something you could talk about for 20 minutes without preparing?",
      "What's your current random obsession?",
      "What does your ideal completely free day look like?",
      "What's something you've done recently that made you really happy?",
      "What's a place you'd happily go back to tomorrow?",
      "What's a very niche skill you have?",
      "What's something you're surprisingly bad at?",
      "If you could instantly become good at one skill, what would it be?",
      "What's your comfort movie, show, food or activity?",
      "What's one thing on your bucket list?",
      "What's a small thing that reliably improves your day?",
      "What's the best spontaneous decision you've ever made?",
      "What hobby would you try if time and money didn't matter?",
      "What's something you think everyone should experience at least once?",
      "What's a surprisingly strong preference you have?"
    ]
  },
  {
    name: "💬 Debate-y",
    description: "Opinions & ideas",
    questions: [
      "What's an opinion you hold that you think many people here would disagree with?",
      "What's something society takes way too seriously?",
      "What's something society doesn't take seriously enough?",
      "What's a topic you could genuinely change your mind about?",
      "What's an argument you've heard that actually changed your mind?",
      "What's the most overrated thing in your opinion?",
      "What's a hill you would die on?",
      "If you could change one thing about university, what would it be?",
      "What's a belief you had as a child that you no longer agree with?",
      "Would you rather always know when someone is lying or always get away with lying?",
      "What's a harmless opinion you would defend with unreasonable passion?",
      "If you could introduce one new law tomorrow, what would it be?",
      "What's something people confuse with being 'good'?",
      "Is there a popular piece of advice you think is actually bad?",
      "What would you ban if you were dictator for exactly 24 hours?"
    ]
  },
  {
    name: "🫶 Get to Know You",
    description: "A little deeper",
    questions: [
      "What kind of people do you tend to click with?",
      "What makes someone a really good friend to you?",
      "When do you feel most like yourself?",
      "What's something you've changed your mind about in the last few years?",
      "What's something you're currently trying to get better at?",
      "What's something you wish you'd started doing earlier?",
      "What makes you feel really understood by someone?",
      "What's something you value more now than you used to?",
      "What's something you wish people asked you about more often?",
      "What's something you're looking forward to?",
      "What kind of environment brings out the best in you?",
      "What's a quality you really appreciate in other people?",
      "What's something you've learned from a friendship?",
      "What makes a conversation memorable for you?",
      "What's something small that makes you feel cared for?"
    ]
  },
  {
    name: "🌀 Unhinged",
    description: "Weird & ridiculous",
    questions: [
      "You have €1 million but must spend it all by tomorrow. What do you buy?",
      "What's the worst superpower you could possibly have?",
      "Which fictional character would be your worst possible flatmate?",
      "You can ban one minor inconvenience from existence. What disappears?",
      "What's the weirdest thing you'd put on your CV if you had to?",
      "If your life had a warning label, what would it say?",
      "What conspiracy theory would you invent if you had to convince people it was true?",
      "What would your presidential campaign slogan be?",
      "You can only eat one cuisine for the rest of your life. Which one?",
      "What's your most irrational pet peeve?",
      "You have to survive a zombie apocalypse with three people from this room. Who do you pick?",
      "If animals could vote, which species would be the most politically chaotic?",
      "You must replace your name with a sound. What sound are you?",
      "What completely useless invention would you love to own?",
      "If you had to be haunted by one celebrity, who would you choose?"
    ]
  },
  {
    name: "🎲 Wildcard",
    description: "Anything goes",
    questions: [
      "What's something you believe that you don't have a good explanation for?",
      "What is a question you wish someone would ask you?",
      "What's the most memorable compliment you've ever received?",
      "If you could relive one ordinary day from your life, which would you choose?",
      "What would you do differently if you knew nobody would judge you?",
      "What's a tiny thing you are irrationally grateful for?",
      "If you could have dinner with anyone, living or dead, who would it be?",
      "What would you want your 80-year-old self to thank you for?",
      "What's something that always makes you laugh?",
      "What is a surprisingly important lesson you've learned?",
      "What's a place that feels like 'home' to you?",
      "If you could know the complete truth about one thing, what would you choose?",
      "What's something you think people should do more often?",
      "What's a memory that makes you smile immediately?",
      "Ask the other person a question you genuinely want to know the answer to."
    ]
  }
];

// ============================================================
// DON'T EDIT BELOW THIS LINE
// ============================================================

let current = null, last = null;

function buildCategories() {
  const container = document.getElementById("categories");
  questionSets.forEach((set, index) => {
    const button = document.createElement("button");
    button.className = "cat";
    const match = set.name.match(/^(\S+)\s+(.*)$/);
    button.innerHTML = `<span>${match ? match[1] : "💬"}</span>${match ? match[2] : set.name}<small>${set.description}</small>`;
    button.onclick = () => pick(index);
    container.appendChild(button);
  });
}
function pick(index) { current = index; last = null; showQuestion(); }
function randomQuestion() {
  const list = questionSets[current].questions;
  let q;
  do { q = list[Math.floor(Math.random() * list.length)]; }
  while (list.length > 1 && q === last);
  last = q;
  return q;
}
function showQuestion() {
  document.getElementById("home").hidden = true;
  document.getElementById("questionCard").hidden = false;
  document.getElementById("categoryPill").textContent = questionSets[current].name;
  document.getElementById("questionText").textContent = randomQuestion();
}
function nextQuestion() { showQuestion(); }
function goHome() {
  document.getElementById("questionCard").hidden = true;
  document.getElementById("home").hidden = false;
}
function shuffleCategory() {
  let next;
  do { next = Math.floor(Math.random() * questionSets.length); }
  while (questionSets.length > 1 && next === current);
  current = next; last = null; showQuestion();
}
buildCategories();
</script>
</body>
</html>
